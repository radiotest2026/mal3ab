name: Rename space.html to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rename space.html to index.html
        run: |
          set -e
          if [ ! -f space.html ]; then
            echo "space.html not found"
            exit 1
          fi
          mv -f space.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename space.html to index.html"
          git push
      - name: Remove workflow after success
        run: |
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove rename workflow after success" || echo "nothing to commit"
          git push
